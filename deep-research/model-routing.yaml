# Model Routing Configuration
#
# 本文件定义按 mode + agent 的任务能力需求。
# 路由为"指令级建议"，具体使用的模型取决于当前 CLI / Agent 环境的能力和可用性。
#
# Capability Levels:
#   high:        高能力模型 — 复杂推理、经营决策、合规分析、最终审计
#   fast:        快速/低成本模型 — 资料初筛、快速起草、通用解释
#   long_context:长上下文模型 — 长文档阅读、多文件摘要、政策/财报/技术文档归纳

available_capabilities:
  high:
    role: reasoning_and_final_analysis
    strengths:
      - complex_reasoning
      - business_decision
      - compliance_analysis
      - final_review
      - technical_route_selection
      - investment_analysis
      - final_report_writing
    cost_level: medium_high

  fast:
    role: fast_search_and_draft
    strengths:
      - fast_drafting
      - source_collection
      - low_cost_iteration
      - rough_outline
      - search_result_organization
    cost_level: low

  long_context:
    role: long_context_reading
    strengths:
      - long_document_reading
      - multi_file_summarization
      - policy_document_extraction
      - contract_and_tender_reading
      - financial_report_extraction
      - technical_document_extraction
    cost_level: medium

default_mode: balanced

mode_profiles:
  balanced:
    planner_agent: high
    source_agent: fast
    long_context_agent: long_context
    analyst_agent: high
    scenario_agent: high
    writer_agent: high
    reviewer_agent: high

  cost_saving:
    planner_agent: fast
    source_agent: fast
    long_context_agent: long_context
    analyst_agent: fast
    scenario_agent: fast
    writer_agent: fast
    reviewer_agent: high
    notes:
      - analyst_agent must escalate complex paragraphs to high capability.
      - final review must still use high capability.

  high_quality:
    planner_agent: high
    source_agent: fast
    long_context_agent: long_context
    analyst_agent: high
    scenario_agent: high
    writer_agent: high
    reviewer_agent: high

  long_context:
    planner_agent: high
    source_agent: fast
    long_context_agent: long_context
    analyst_agent: high
    scenario_agent: high
    writer_agent: high
    reviewer_agent: high

  draft_fast:
    planner_agent: fast
    source_agent: fast
    long_context_agent: long_context
    analyst_agent: fast
    scenario_agent: fast
    writer_agent: fast
    reviewer_agent: high
    notes:
      - Use only when the user wants a fast draft or rough framework.
      - Mark lower source strictness if the user does not require formal citation.

force_high_quality_keywords:
  - 高质量
  - 认真做
  - 认真分析
  - 用于汇报
  - 用于决策
  - 给领导看

mode_keywords:
  high_quality:
    - 立项
    - 决策
    - 董事会
    - 总经理办公会
    - 政府汇报
    - 国企
    - 合规
    - 经营分析
    - 商业模式
    - 投资分析
    - 技术路线
    - 架构选型
    - 深度研究
    - 对标分析
    - 风险评估
    - 给领导看
    - 用于汇报
    - 认真分析
  long_context:
    - 基于这个文件
    - 读取报告
    - 优化现有报告
    - 审校
    - 重写
    - 总结这个文档
    - 多份材料
    - 附件
    - uploaded file
    - 根据已有报告
  cost_saving:
    - 简单整理
    - 快速看一下
    - 初步分析
    - 不用太详细
    - 先给个框架
    - 省成本
    - 先粗略
  draft_fast:
    - 快速初稿
    - 先出一版
    - 后续人工修改

escalation_rules:
  must_use_high_capability:
    - compliance_or_law
    - funds_payment_tax_or_second_clearing
    - company_project_approval_or_budget
    - investment_decision
    - financial_modeling_or_valuation
    - revenue_forecast
    - final_conclusion
    - quality_review
    - fast_uncertainty_or_logic_gap
    - user_requests_serious_or_leadership_use

fallback_rules:
  long_context_unavailable:
    action: use_high_capability_for_long_context
  high_capability_unavailable:
    action: use_fast_or_long_context_for_draft_only
    required_notice: 本次未使用高能力审计模型，结论需人工复核。
  fast_unavailable:
    action: use_high_capability_for_source_and_draft
    required_notice: 资料搜索和初稿生成改用高能力模型，成本可能上升。
  subagents_unavailable:
    action: sequential_single_agent_workflow
    required_notice: 本次未启用 Subagent 分工，采用单 Agent 模式完成。

output_contracts:
  must_report:
    - task_type
    - running_mode
    - research_framework
    - enabled_subagents
    - model_mapping
    - escalation_triggered
    - fallback_triggered
    - source_audit_status
    - quality_review_status
