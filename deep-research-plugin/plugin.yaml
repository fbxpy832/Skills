schema: deep-research.multi-host.v1
kind: multi_host_package
name: deep-research-plugin
version: "1.0.0"
description: Multi-host enterprise Deep Research distribution package

entrypoints:
  opencode:
    plugin: index.js
    runner: scripts/opencode-research-runner.sh
  generic:
    runner: scripts/generic-research-runner.sh
  setup:
    command: scripts/setup.sh
  eval:
    command: eval/run-eval.sh

skills:
  - path: SKILL.md

scripts:
  setup: scripts/setup.sh
  search: scripts/search.sh
  model-router: scripts/model-router.sh
  generic-runner: scripts/generic-research-runner.sh
  opencode-runner: scripts/opencode-research-runner.sh

env:
  - BRAVE_API_KEY
  - BOCHA_API_KEY
  - EXA_API_KEY
  - DEEP_RESEARCH_OUTPUT_DIR
  - DEEP_RESEARCH_AGENTS
  - DEEP_RESEARCH_CONFIG_ENV
  - DEEP_RESEARCH_SKILL_CONFIG_DIR

providers:
  model-router: scripts/model-router.sh
