[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "obsidian-vocab-capture"
version = "0.1.0"
description = "English vocabulary capture tool that queries AI and writes to Obsidian vault"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Richard"}
]
dependencies = [
    "typer>=0.9.0",
    "httpx>=0.24.0",
    "pydantic>=2.0.0",
    "rich>=13.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
    "pytest-mock>=3.10",
]

[project.scripts]
obsidian-vocab-capture = "obsidian_vocab_capture.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
