  需要联网搜索最新行业数据并结合内部业务背景。
mode: high_quality
expected_agents:
  - planner_agent
  - source_agent
  - analyst_agent
  - scenario_agent
  - writer_agent
  - reviewer_agent
expected_outputs:
  - run-summary.md
  - execution-context.md
  - source_failure_log.md
  - events.ndjson
success_criteria:
  - model_routing_has_all_agents
  - source_failure_log_exists
  - events_contain_run_started
  - events_contain_run_completed
  - artifacts_have_model_detection_status
