<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'" />
  <title>Skill Hub</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="app-header">
    <div class="header-brand">
      <span class="header-logo">Skill Hub</span>
      <span class="header-subtitle">Skill Distribution Manager</span>
    </div>
    <span class="header-status" id="statusIndicator">Idle</span>
  </div>

  <div class="control-bar">
    <div class="source-controls">
      <input type="text" class="path-input" id="sourcePath" placeholder="Source root path..." autofocus />
      <button class="btn btn-primary" id="btnRefresh">Scan</button>
      <button class="btn btn-secondary" id="btnPull">Pull</button>
    </div>
  </div>

  <div class="action-bar">
    <div class="action-left">
      <button class="btn btn-primary" id="btnSyncSelected" disabled>Sync Selected</button>
      <button class="btn btn-danger" id="btnDeleteSelected" disabled>Delete Selected</button>
      <label class="force-toggle" title="Replace target folders even if they lack SKILL.md">
        <input type="checkbox" id="chkForce" />
        <span>Force</span>
      </label>
    </div>
    <span class="selected-count" id="selectedCount"></span>
  </div>

  <div class="git-info" id="gitInfo"></div>

  <div class="main-area">
    <div class="panel panel-skills">
      <div class="panel-header">
        <span class="panel-title">Skills</span>
        <div class="panel-actions">
          <button class="btn-sm" id="btnSelectAll">All</button>
          <button class="btn-sm" id="btnSelectNone">None</button>
        </div>
      </div>
      <div class="skill-list" id="skillList">
        <div class="empty-state">Press Scan to load skills.</div>
      </div>
    </div>

    <div class="panel panel-targets">
      <div class="panel-header">
        <span class="panel-title">Status per Target</span>
      </div>
      <div class="target-grid" id="targetGrid">
        <div class="empty-state">No scan data.</div>
      </div>
    </div>
  </div>

  <div class="log-bar" id="logBar">
    <div class="log-header">
      <span class="panel-title">Log</span>
      <button class="btn-sm" id="btnClearLog">Clear</button>
    </div>
    <div class="log-output" id="logOutput"></div>
  </div>

  <script src="app.js"></script>
</body>
</html>
