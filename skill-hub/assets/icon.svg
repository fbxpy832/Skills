<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a1a2e"/>
      <stop offset="100%" stop-color="#0f0f23"/>
    </linearGradient>
  </defs>
  <!-- Background circle -->
  <circle cx="128" cy="128" r="120" fill="url(#bg)" stroke="#2a2a4a" stroke-width="2"/>
  <!-- Central node (Skill Hub) -->
  <circle cx="128" cy="128" r="24" fill="#5b8def" opacity="0.9"/>
  <circle cx="128" cy="128" r="12" fill="#fff" opacity="0.3"/>
  <!-- Four distribution arms to tool nodes -->
  <!-- Top-left: Codex -->
  <line x1="115" y1="115" x2="72" y2="72" stroke="#5b8def" stroke-width="3" stroke-linecap="round"/>
  <circle cx="66" cy="66" r="14" fill="#e0a020"/>
  <text x="66" y="70" text-anchor="middle" fill="#1a1a2e" font-size="9" font-family="sans-serif" font-weight="bold">CX</text>
  <!-- Top-right: Claude Code -->
  <line x1="141" y1="115" x2="184" y2="72" stroke="#5b8def" stroke-width="3" stroke-linecap="round"/>
  <circle cx="192" cy="66" r="14" fill="#f0b880"/>
  <text x="192" y="70" text-anchor="middle" fill="#1a1a2e" font-size="9" font-family="sans-serif" font-weight="bold">CC</text>
  <!-- Bottom-left: OpenCode -->
  <line x1="115" y1="141" x2="72" y2="184" stroke="#5b8def" stroke-width="3" stroke-linecap="round"/>
  <circle cx="66" cy="192" r="14" fill="#60c0c0"/>
  <text x="66" y="196" text-anchor="middle" fill="#1a1a2e" font-size="9" font-family="sans-serif" font-weight="bold">OC</text>
  <!-- Bottom-right: Hermes -->
  <line x1="141" y1="141" x2="184" y2="184" stroke="#5b8def" stroke-width="3" stroke-linecap="round"/>
  <circle cx="192" cy="192" r="14" fill="#a080d0"/>
  <text x="192" y="196" text-anchor="middle" fill="#1a1a2e" font-size="9" font-family="sans-serif" font-weight="bold">HM</text>
  <!-- Center "S" on Hub -->
  <text x="128" y="133" text-anchor="middle" fill="#fff" font-size="14" font-family="sans-serif" font-weight="bold">S</text>
</svg>
